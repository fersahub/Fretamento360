<style>
:root{--navy:#0b1c32;--navy2:#122b49;--blue:#2864dc;--bg:#f3f6fb;--card:#fff;--ink:#17263b;--muted:#738197;--line:#e5eaf2;--green:#16865c;--amber:#b7791f;--red:#c24145;--shadow:0 8px 24px #1427420b}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.sidebar{width:248px;background:var(--navy);color:#dce7f8;padding:22px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:10}.brand{display:flex;align-items:center;gap:11px;padding:4px 9px 26px}.logo{width:39px;height:39px;border-radius:12px;background:linear-gradient(145deg,#4385f5,#1f4fb9);display:grid;place-items:center;color:white;font-weight:900;font-size:19px}.brand b{font-size:16px;letter-spacing:.2px}.brand small{display:block;color:#8fa4c1;font-size:10px;letter-spacing:1.5px;text-transform:uppercase}.navlabel{font-size:10px;color:#7289a8;font-weight:800;letter-spacing:1.4px;padding:12px 12px 7px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#b9c8dc;text-align:left;padding:10px 12px;border-radius:9px;display:flex;gap:12px;align-items:center;font-size:13px}.nav button:hover,.nav button.active{background:#ffffff14;color:white}.nav button.active{box-shadow:inset 3px 0 #63a0ff}.nav .ico{width:18px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;border-top:1px solid #ffffff19;padding:14px 9px 0;color:#8fa4c1;font-size:11px}.main{margin-left:248px;width:calc(100% - 248px);min-width:0}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.crumb{font-weight:700}.user{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.avatar{width:32px;height:32px;border-radius:50%;background:#e7efff;color:#2459bd;display:grid;place-items:center;font-weight:800}.content{max-width:1440px;margin:auto;padding:28px 30px 48px}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:800}.pagehead h1{margin:4px 0 3px;font-size:25px;letter-spacing:-.6px}.sub{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:white;color:var(--ink);font-weight:700;font-size:12px}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn:hover{filter:brightness(.97)}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:var(--shadow);min-width:0}.stat{display:flex;align-items:center;justify-content:space-between}.stat .label{color:var(--muted);font-size:11px;font-weight:650}.stat strong{display:block;font-size:26px;margin-top:8px;letter-spacing:-.8px}.stat .symbol{width:36px;height:36px;border-radius:10px;background:#edf3ff;color:var(--blue);display:grid;place-items:center;font-size:17px}.stat small{color:var(--muted);font-size:10px}.cols{grid-template-columns:1.5fr 1fr}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}.cardhead h3{font-size:14px;margin:0}.muted{color:var(--muted)}.bars{display:flex;align-items:end;gap:13px;height:170px;padding:10px 4px 0;border-bottom:1px solid var(--line)}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:end}.bar{width:min(32px,80%);background:linear-gradient(180deg,#68a0ff,#2864dc);border-radius:6px 6px 2px 2px;min-height:4px}.barcol small{font-size:10px;color:var(--muted)}.legend{display:flex;gap:16px;margin-top:12px;color:var(--muted);font-size:10px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-right:5px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#8290a4;font-size:10px;text-transform:uppercase;letter-spacing:.7px;padding:11px 10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid #eef1f6;font-size:12px}tr:last-child td{border-bottom:0}.pill{display:inline-flex;align-items:center;border-radius:30px;padding:4px 8px;font-size:10px;font-weight:800;background:#eef2f7;color:#66758b}.pill.ok{background:#e6f6ef;color:#147650}.pill.warn{background:#fff4df;color:#9b6813}.pill.danger{background:#ffebeb;color:#b33c42}.section{margin-top:17px}.empty{text-align:center;padding:30px;color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:13px;flex-wrap:wrap}.search{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:white;min-width:210px}.notice{padding:12px 14px;border-radius:10px;background:#eef4ff;border:1px solid #dce8ff;color:#38598f;font-size:12px;margin-bottom:16px}.cards2{grid-template-columns:repeat(2,minmax(0,1fr))}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:11px;color:#596980;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #dce3ed;border-radius:8px;padding:9px 10px;background:white;color:var(--ink)}.field textarea{min-height:75px;resize:vertical}.modalback{position:fixed;inset:0;background:#0b1c3280;display:none;place-items:center;padding:18px;z-index:30}.modalback.show{display:grid}.modal{background:#fff;border-radius:14px;width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 25px 80px #0b1c3250}.modal h2{margin:0 0 14px;font-size:18px}.modalfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.checkrow{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--line)}.checkrow input{accent-color:var(--blue)}.progress{height:8px;background:#edf1f6;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue)}.procedure{padding:14px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px}.procedure b{display:block;margin-bottom:4px}.mobilemenu{display:none}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}@media(max-width:700px){.sidebar{width:0;padding:0;overflow:hidden}.sidebar.open{width:248px;padding:22px 14px}.main{margin-left:0;width:100%}.topbar{padding:0 16px}.content{padding:20px 15px 36px}.pagehead{flex-direction:column}.cards2{grid-template-columns:1fr}.mobilemenu{display:inline-flex}.user span{display:none}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">F</div><div><b>Fretamento360</b><small>Gestão operacional</small></div></div>
 <div class="navlabel">OPERAÇÃO</div><nav class="nav" id="nav">
 <button data-view="dashboard" class="active"><span class="ico">▦</span>Visão geral</button>
 <button data-view="diagnostico"><span class="ico">◈</span>Diagnóstico</button>
 <button data-view="ocorrencias"><span class="ico">⚑</span>Ocorrências</button>
 <button data-view="quebras"><span class="ico">⚙</span>Quebras e atrasos</button>
 <button data-view="programacao"><span class="ico">▤</span>Programação</button>
 <button data-view="escalas"><span class="ico">◷</span>Escalas e jornadas</button>
 <div class="navlabel">CADASTROS</div>
 <button data-view="frota"><span class="ico">▣</span>Frota</button>
 <button data-view="motoristas"><span class="ico">♙</span>Motoristas</button>
 <button data-view="rotas"><span class="ico">⌖</span>Rotas e clientes</button>
 <div class="navlabel">GESTÃO</div>
 <button data-view="sla"><span class="ico">◉</span>Indicadores de SLA</button>
 <button data-view="relatorios"><span class="ico">▧</span>Relatórios</button>
 <button data-view="procedimentos"><span class="ico">☷</span>Procedimentos</button>
 </nav>
 <div class="sidefoot">Fretamento360 · MVP 0.1<br>Modo demonstração • Dados neste navegador</div>
</aside>
<main class="main">
 <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="btn mobilemenu" id="menubtn">☰</button><div class="crumb" id="crumb">Visão geral</div></div><div class="user"><span>Ambiente demonstrativo</span><div class="avatar">F</div></div></header>
 <div class="content" id="content"></div>
</main>
</div>
<div class="modalback" id="modalback"><div class="modal"><h2 id="modaltitle">Novo registro</h2><div id="modalbody"></div><div class="modalfoot"><button class="btn" id="cancel">Cancelar</button><button class="btn primary" id="save">Salvar registro</button></div></div></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=new Date().toISOString().slice(0,10);
const seed={
 occurrences:[
 {id:1,date:today,time:'06:42',type:'Atraso',severity:'Média',vehicle:'VAN-012',driver:'Carlos Mendes',route:'Rota Centro',affected:12,minutes:17,status:'Tratada',description:'Trânsito intenso no acesso principal',action:'Cliente comunicado e horário atualizado.'},
 {id:2,date:today,time:'07:15',type:'Quebra',severity:'Alta',vehicle:'BUS-004',driver:'Marcos Lima',route:'Rota Industrial',affected:28,minutes:35,status:'Em análise',description:'Falha no sistema de arrefecimento',action:'Veículo reserva acionado.'},
 {id:3,date:today,time:'08:05',type:'Falha de embarque',severity:'Baixa',vehicle:'VAN-008',driver:'Ana Souza',route:'Rota Norte',affected:1,minutes:0,status:'Tratada',description:'Passageiro não localizado no ponto',action:'Contato com atendimento.'}],
 vehicles:[{id:1,code:'BUS-004',model:'Mercedes OF',capacity:44,status:'Manutenção'},{id:2,code:'VAN-008',model:'Sprinter',capacity:16,status:'Disponível'},{id:3,code:'VAN-012',model:'Master',capacity:16,status:'Disponível'},{id:4,code:'BUS-009',model:'Volkswagen 17.230',capacity:46,status:'Disponível'}],
 drivers:[{id:1,name:'Carlos Mendes',license:'D',expiry:'2027-08-12',status:'Ativo'},{id:2,name:'Marcos Lima',license:'D',expiry:'2027-02-18',status:'Ativo'},{id:3,name:'Ana Souza',license:'D',expiry:'2026-12-05',status:'Ativo'}],
 routes:[{id:1,name:'Rota Centro',client:'Indústria Alfa',origin:'Centro',destination:'Polo Industrial',time:'06:30'},{id:2,name:'Rota Norte',client:'Empresa Beta',origin:'Aeroporto',destination:'Centro',time:'07:00'},{id:3,name:'Rota Industrial',client:'Indústria Alfa',origin:'Terminal',destination:'Polo Industrial',time:'06:00'}],
 schedules:[{id:1,date:today,driver:'Carlos Mendes',vehicle:'VAN-012',route:'Rota Centro',start:'05:45',end:'14:00',status:'Programada'},{id:2,date:today,driver:'Marcos Lima',vehicle:'BUS-004',route:'Rota Industrial',start:'05:30',end:'14:30',status:'Substituição'},{id:3,date:today,driver:'Ana Souza',vehicle:'VAN-008',route:'Rota Norte',start:'06:15',end:'15:00',status:'Programada'}],
 procedures:[{id:1,title:'Comunicação de atrasos',category:'Ocorrências',body:'Registrar horário, motivo, roteiro, quantidade de passageiros afetados e previsão atualizada. Comunicar o cliente e acompanhar a normalização.'},{id:2,title:'Procedimento em caso de quebra',category:'Frota',body:'Priorizar a segurança, acionar manutenção, avaliar veículo reserva, registrar passageiros impactados e atualizar as partes envolvidas.'},{id:3,title:'Conferência de roteiro',category:'Motoristas',body:'Verificar o roteiro completo antes do início da jornada e esclarecer dúvidas com a operação.'}],
 slaTarget:97
};
let db={};Object.keys(seed).forEach(k=>{try{db[k]=JSON.parse(localStorage.getItem('f360_'+k))??seed[k]}catch{db[k]=seed[k]}});
function persist(k){localStorage.setItem('f360_'+k,JSON.stringify(db[k]))}
let current='dashboard', modalSave=null;
const titles={dashboard:'Visão geral',diagnostico:'Diagnóstico operacional',ocorrencias:'Controle de ocorrências',quebras:'Quebras e atrasos',programacao:'Programação de serviços',escalas:'Escalas e jornadas',frota:'Gestão de frota',motoristas:'Motoristas',rotas:'Rotas e clientes',sla:'Indicadores de SLA',relatorios:'Relatórios gerenciais',procedimentos:'Procedimentos operacionais'};
function pagehead(title,sub,action){return '<div class="pagehead"><div><div class="eyebrow">FRETAMENTO360 / OPERAÇÃO</div><h1>'+title+'</h1><div class="sub">'+sub+'</div></div><div class="actions">'+(action||'')+'</div></div>'}
function button(txt,fn,primary=true){return '<button class="btn '+(primary?'primary':'')+'" onclick="'+fn+'">'+txt+'</button>'}
function stat(label,value,symbol,foot){return '<div class="card stat"><div><div class="label">'+label+'</div><strong>'+value+'</strong><small>'+foot+'</small></div><div class="symbol">'+symbol+'</div></div>'}
function table(headers,rows){return '<div class="tablewrap"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+headers.length+'" class="empty">Nenhum registro encontrado.</td></tr>')+'</tbody></table></div>'}
function pill(v){let c=/Tratada|Ativo|Disponível|Realizado|Concluído/i.test(v)?'ok':/Alta|Manutenção|Atrasado|Em análise|Vencida/i.test(v)?'danger':'warn';return '<span class="pill '+c+'">'+esc(v)+'</span>'}
function rowOcc(o){return '<tr><td>'+esc(o.date)+' '+esc(o.time)+'</td><td><b>'+esc(o.type)+'</b></td><td>'+esc(o.vehicle)+'</td><td>'+esc(o.driver)+'</td><td>'+esc(o.route)+'</td><td>'+pill(o.severity)+'</td><td>'+pill(o.status)+'</td></tr>'}
function render(){
 $('#crumb').textContent=titles[current];let c=$('#content');
 if(current==='dashboard'){
 let n=db.occurrences.length, breaks=db.occurrences.filter(x=>x.type==='Quebra').length, delays=db.occurrences.filter(x=>x.type==='Atraso').length, ready=db.vehicles.filter(x=>x.status==='Disponível').length;
 let done=Math.max(0,100-Math.round(db.occurrences.reduce((a,x)=>a+(+x.minutes||0),0)/Math.max(1,n*8)));
 c.innerHTML=pagehead('Visão geral','Resumo da operação e indicadores registrados.',button('＋ Nova ocorrência',"openOccurrence()"))+
 '<div class="notice">Modo demonstração: os dados ficam salvos somente neste navegador. Utilize informações fictícias até configurar autenticação e banco de dados.</div>'+
 '<div class="grid stats">'+stat('Ocorrências registradas',n,'⚑','Total no histórico')+stat('Quebras registradas',breaks,'⚙','Eventos classificados como quebra')+stat('Atrasos registrados',delays,'◷','Eventos classificados como atraso')+stat('Veículos disponíveis',ready+'/'+db.vehicles.length,'▣','Disponibilidade cadastrada')+'</div>'+
 '<div class="grid cols"><div class="card"><div class="cardhead"><h3>Ocorrências recentes</h3><span class="muted">Últimos registros</span></div>'+table(['Data / hora','Tipo','Veículo','Motorista','Rota','Gravidade','Status'],db.occurrences.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,5).map(rowOcc))+'</div>'+
 '<div class="card"><div class="cardhead"><h3>Distribuição de ocorrências</h3><span class="muted">Por categoria</span></div>'+chart()+'</div></div>'+
 '<div class="grid cols section"><div class="card"><div class="cardhead"><h3>Disponibilidade da frota</h3>'+button('Ver frota',"go('frota')",false)+'</div>'+table(['Veículo','Modelo','Capacidade','Situação'],db.vehicles.slice(0,5).map(v=>'<tr><td><b>'+esc(v.code)+'</b></td><td>'+esc(v.model)+'</td><td>'+v.capacity+'</td><td>'+pill(v.status)+'</td></tr>'))+'</div><div class="card"><div class="cardhead"><h3>Atalhos operacionais</h3></div><div class="grid cards2">'+button('Registrar ocorrência',"openOccurrence()",false)+button('Programar serviço',"openSchedule()",false)+button('Cadastrar veículo',"addVehicle()",false)+button('Gerar relatório',"go('relatorios')",false)+'</div></div></div>';
 } else if(current==='ocorrencias'){
 c.innerHTML=pagehead(titles[current],'Registre, acompanhe e consulte eventos da operação.',button('＋ Nova ocorrência',"openOccurrence()"))+'<div class="card">'+table(['Data / hora','Tipo','Veículo','Motorista','Rota','Passageiros','Min. atraso','Gravidade','Status','Ação'],db.occurrences.map(o=>'<tr><td>'+esc(o.date)+' '+esc(o.time)+'</td><td>'+esc(o.type)+'</td><td>'+esc(o.vehicle)+'</td><td>'+esc(o.driver)+'</td><td>'+esc(o.route)+'</td><td>'+o.affected+'</td><td>'+o.minutes+'</td><td>'+pill(o.severity)+'</td><td>'+pill(o.status)+'</td><td><button class="btn" onclick="editOccurrence('+o.id+')">Editar</button> <button class="btn" onclick="removeItem(\'occurrences\','+o.id+')">Excluir</button></td></tr>'))+'</div>';
 } else if(current==='quebras'){
 let q=db.occurrences.filter(o=>o.type==='Quebra'||o.type==='Atraso'), by={};q.forEach(o=>by[o.vehicle]=(by[o.vehicle]||0)+1);
 c.innerHTML=pagehead(titles[current],'Acompanhe indisponibilidades, atrasos, impactos e reincidências.',button('＋ Registrar evento',"openOccurrence()"))+'<div class="grid stats">'+stat('Eventos de quebra',q.filter(o=>o.type==='Quebra').length,'⚙','Registros classificados')+stat('Eventos de atraso',q.filter(o=>o.type==='Atraso').length,'◷','Registros classificados')+stat('Minutos de atraso',q.reduce((a,o)=>a+(+o.minutes||0),0),'⌛','Soma informada')+stat('Passageiros afetados',q.reduce((a,o)=>a+(+o.affected||0),0),'♙','Soma dos eventos')+'</div><div class="grid cols"><div class="card"><div class="cardhead"><h3>Histórico de quebras e atrasos</h3></div>'+table(['Data','Tipo','Veículo','Motorista','Minutos','Descrição'],q.map(o=>'<tr><td>'+esc(o.date)+'</td><td>'+esc(o.type)+'</td><td>'+esc(o.vehicle)+'</td><td>'+esc(o.driver)+'</td><td>'+o.minutes+'</td><td>'+esc(o.description)+'</td></tr>'))+'</div><div class="card"><div class="cardhead"><h3>Eventos por veículo</h3></div>'+Object.keys(by).sort((a,b)=>by[b]-by[a]).map(k=>'<div style="margin:14px 0"><div class="cardhead"><b>'+esc(k)+'</b><b>'+by[k]+'</b></div><div class="progress"><span style="width:'+Math.min(100,by[k]/Math.max(1,q.length)*100)+'%"></span></div></div>').join('')+'</div></div>';
 } else if(current==='frota'){
 c.innerHTML=pagehead(titles[current],'Cadastre veículos e acompanhe a disponibilidade.',button('＋ Novo veículo',"addVehicle()"))+'<div class="card">'+table(['Prefixo','Modelo','Capacidade','Situação','Ações'],db.vehicles.map(v=>'<tr><td><b>'+esc(v.code)+'</b></td><td>'+esc(v.model)+'</td><td>'+v.capacity+' lugares</td><td>'+pill(v.status)+'</td><td><button class="btn" onclick="editVehicle('+v.id+')">Editar</button> <button class="btn" onclick="removeItem(\'vehicles\','+v.id+')">Excluir</button></td></tr>'))+'</div>';
 } else if(current==='motoristas'){
 c.innerHTML=pagehead(titles[current],'Cadastro e acompanhamento documental da equipe.',button('＋ Novo motorista',"addDriver()"))+'<div class="card">'+table(['Motorista','Categoria CNH','Validade CNH','Situação','Ações'],db.drivers.map(d=>'<tr><td><b>'+esc(d.name)+'</b></td><td>'+esc(d.license)+'</td><td>'+esc(d.expiry)+'</td><td>'+pill(d.status)+'</td><td><button class="btn" onclick="editDriver('+d.id+')">Editar</button> <button class="btn" onclick="removeItem(\'drivers\','+d.id+')">Excluir</button></td></tr>'))+'</div>';
 } else if(current==='rotas'){
 c.innerHTML=pagehead(titles[current],'Clientes atendidos, origem, destino e horários de referência.',button('＋ Nova rota',"addRoute()"))+'<div class="card">'+table(['Rota','Cliente','Origem','Destino','Horário','Ações'],db.routes.map(r=>'<tr><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.client)+'</td><td>'+esc(r.origin)+'</td><td>'+esc(r.destination)+'</td><td>'+esc(r.time)+'</td><td><button class="btn" onclick="editRoute('+r.id+')">Editar</button> <button class="btn" onclick="removeItem(\'routes\','+r.id+')">Excluir</button></td></tr>'))+'</div>';
 } else if(current==='programacao'||current==='escalas'){
 c.innerHTML=pagehead(current==='programacao'?'Programação de serviços':'Escalas e jornadas','Organize os serviços, motoristas, veículos e horários previstos.',button('＋ Nova programação',"openSchedule()"))+'<div class="card">'+table(['Data','Motorista','Veículo','Rota','Início','Término','Situação','Ações'],db.schedules.map(s=>'<tr><td>'+esc(s.date)+'</td><td>'+esc(s.driver)+'</td><td>'+esc(s.vehicle)+'</td><td>'+esc(s.route)+'</td><td>'+esc(s.start)+'</td><td>'+esc(s.end)+'</td><td>'+pill(s.status)+'</td><td><button class="btn" onclick="removeItem(\'schedules\','+s.id+')">Excluir</button></td></tr>'))+'</div><div class="notice section">Este módulo organiza horários informados pela operação. Não substitui registro oficial de ponto nem valida automaticamente o cumprimento da legislação trabalhista.</div>';
 } else if(current==='sla'){
 let completed=Math.max(0,100-(db.occurrences.filter(o=>o.type==='Atraso'||o.type==='Quebra').length/Math.max(1,db.schedules.length)*100));completed=Math.min(100,Math.round(completed*10)/10);
 c.innerHTML=pagehead(titles[current],'Configure uma meta e acompanhe indicadores calculados sobre os registros disponíveis.',button('Configurar meta',"setTarget()",false))+'<div class="grid stats">'+stat('Meta configurada',db.slaTarget+'%','◎','Limite de referência')+stat('Índice demonstrativo',completed+'%','◉','Estimativa baseada nos registros')+stat('Serviços cadastrados',db.schedules.length,'▤','Programações registradas')+stat('Ocorrências',db.occurrences.length,'⚑','Eventos no histórico')+'</div><div class="card"><h3>Como interpretar este indicador</h3><p class="muted">O índice demonstrativo usa a quantidade de eventos de atraso e quebra em relação aos serviços cadastrados. Para um SLA contratual válido, configure critérios, pesos, tolerâncias, exclusões e a fonte oficial de confirmação de cada serviço.</p><div class="progress"><span style="width:'+completed+'%"></span></div><p>'+ (completed>=db.slaTarget?'Meta ilustrativa atingida.':'Abaixo da meta ilustrativa configurada.')+'</p></div>';
 } else if(current==='diagnostico'){
 let qs=['A empresa possui cadastro atualizado de veículos e motoristas?','As escalas são planejadas e revisadas antes da operação?','As ocorrências são registradas com data, hora e providências?','Existe acompanhamento formal de atrasos e quebras?','Os contratos possuem metas de SLA monitoradas?','Há procedimentos documentados para situações críticas?','A operação gera relatórios periódicos para a gestão?'];
 let vals=JSON.parse(localStorage.getItem('f360_diag')||'{}'),score=qs.filter((q,i)=>vals[i]).length;
 c.innerHTML=pagehead(titles[current],'Avalie os processos e identifique prioridades de melhoria.')+'<div class="grid cols"><div class="card"><div class="cardhead"><h3>Questionário de maturidade</h3><b>'+Math.round(score/qs.length*100)+'%</b></div>'+qs.map((q,i)=>'<label class="checkrow"><input type="checkbox" '+(vals[i]?'checked':'')+' onchange="diag('+i+',this.checked)"> <span>'+q+'</span></label>').join('')+'<div class="section"><div class="progress"><span style="width:'+score/qs.length*100+'%"></span></div></div></div><div class="card"><h3>Resultado do diagnóstico</h3><div style="font-size:38px;font-weight:800;margin:15px 0;color:var(--blue)">'+Math.round(score/qs.length*100)+'<small style="font-size:17px">/100</small></div><b>'+ (score>=6?'Maturidade estruturada':score>=3?'Maturidade em desenvolvimento':'Necessita de estruturação')+'</b><p class="muted">Priorize as respostas não assinaladas. Este questionário é uma ferramenta de autoavaliação e não uma auditoria certificada.</p></div></div>';
 } else if(current==='relatorios'){
 c.innerHTML=pagehead(titles[current],'Exporte os registros operacionais para análise e apresentação.',button('⇩ Exportar ocorrências CSV',"exportCSV()"))+'<div class="grid stats">'+stat('Ocorrências',db.occurrences.length,'⚑','Base atual')+stat('Veículos',db.vehicles.length,'▣','Cadastro atual')+stat('Motoristas',db.drivers.length,'♙','Cadastro atual')+stat('Escalas',db.schedules.length,'◷','Programações atuais')+'</div><div class="card"><h3>Resumo do período disponível</h3><p class="muted">O modo demonstração não aplica filtros de período avançados. Exporte os registros para abrir no Excel ou imprima esta página para salvar um PDF.</p>'+button('Imprimir / Salvar PDF',"window.print()",false)+'</div>';
 } else if(current==='procedimentos'){
 c.innerHTML=pagehead(titles[current],'Biblioteca de protocolos, orientações e padrões de comunicação.',button('＋ Novo procedimento',"addProcedure()"))+'<div class="grid cards2">'+db.procedures.map(p=>'<div class="procedure"><span class="pill">'+esc(p.category)+'</span><b style="margin-top:9px">'+esc(p.title)+'</b><p class="muted">'+esc(p.body)+'</p><button class="btn" onclick="removeItem(\'procedures\','+p.id+')">Excluir</button></div>').join('')+'</div>';
 }
}
function chart(){let cats=['Atraso','Quebra','Falha de embarque','Outros'],counts=cats.map(c=>db.occurrences.filter(o=>o.type===c).length),max=Math.max(1,...counts);return '<div class="bars">'+counts.map((x,i)=>'<div class="barcol"><b>'+x+'</b><div class="bar" style="height:'+Math.max(4,x/max*110)+'px"></div><small>'+cats[i]+'</small></div>').join('')+'</div><div class="legend"><span><i class="dot"></i>Eventos registrados</span></div>'}
function go(v){current=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#sidebar').classList.remove('open');render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-view]');if(b)go(b.dataset.view)});
$('#menubtn').onclick=()=>$('#sidebar').classList.toggle('open');
function field(label,name,type='text',value='',opts){let control=type==='select'?'<select name="'+name+'">'+opts.map(x=>'<option '+(x===value?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>':type==='textarea'?'<textarea name="'+name+'">'+esc(value)+'</textarea>':'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'">';return '<div class="field"><label>'+label+'</label>'+control+'</div>'}
function openModal(title,body,save){$('#modaltitle').textContent=title;$('#modalbody').innerHTML=body;modalSave=save;$('#modalback').classList.add('show')}
function closeModal(){$('#modalback').classList.remove('show');modalSave=null}
$('#cancel').onclick=closeModal;$('#save').onclick=()=>{if(modalSave)modalSave(new FormData($('#modalbody').querySelector('form')||$('#modalbody')));closeModal()};
function formBody(fields){return '<form>'+fields.join('')+'</form>'}
function values(f){let o={};f.forEach((v,k)=>o[k]=v);return o}
function openOccurrence(id){let old=db.occurrences.find(x=>x.id===id)||{},edit=!!id;openModal(edit?'Editar ocorrência':'Nova ocorrência',formBody([
field('Data','date','date',old.date||today),field('Horário','time','time',old.time||'06:00'),field('Tipo','type','select',old.type||'Atraso',['Atraso','Quebra','Falha de embarque','Acidente','Reclamação','Outro']),field('Gravidade','severity','select',old.severity||'Média',['Baixa','Média','Alta','Crítica']),field('Veículo','vehicle','select',old.vehicle||db.vehicles[0]?.code||'',db.vehicles.map(x=>x.code).concat(['Não informado'])),field('Motorista','driver','select',old.driver||db.drivers[0]?.name||'',db.drivers.map(x=>x.name).concat(['Não informado'])),field('Rota','route','select',old.route||db.routes[0]?.name||'',db.routes.map(x=>x.name).concat(['Não informada'])),field('Passageiros afetados','affected','number',old.affected||0),field('Minutos de atraso','minutes','number',old.minutes||0),field('Descrição','description','textarea',old.description||''),field('Providências adotadas','action','textarea',old.action||''),field('Status','status','select',old.status||'Em análise',['Em análise','Em andamento','Tratada'])]),f=>{let v=values(f);['affected','minutes'].forEach(k=>v[k]=Number(v[k]||0));if(edit)Object.assign(old,v);else db.occurrences.unshift({id:Date.now(),...v});persist('occurrences');render()})}
function editOccurrence(id){openOccurrence(id)}
function addVehicle(id){let o=db.vehicles.find(x=>x.id===id)||{},edit=!!id;openModal(edit?'Editar veículo':'Novo veículo',formBody([field('Prefixo','code','text',o.code||''),field('Modelo','model','text',o.model||''),field('Capacidade','capacity','number',o.capacity||16),field('Situação','status','select',o.status||'Disponível',['Disponível','Em operação','Manutenção','Inativo'])]),f=>{let v=values(f);v.capacity=+v.capacity;if(edit)Object.assign(o,v);else db.vehicles.push({id:Date.now(),...v});persist('vehicles');render()})}
function editVehicle(id){addVehicle(id)}
function addDriver(id){let o=db.drivers.find(x=>x.id===id)||{},edit=!!id;openModal(edit?'Editar motorista':'Novo motorista',formBody([field('Nome completo','name','text',o.name||''),field('Categoria CNH','license','select',o.license||'D',['B','C','D','E']),field('Validade CNH','expiry','date',o.expiry||''),field('Situação','status','select',o.status||'Ativo',['Ativo','Inativo','Afastado'])]),f=>{let v=values(f);if(edit)Object.assign(o,v);else db.drivers.push({id:Date.now(),...v});persist('drivers');render()})}
function editDriver(id){addDriver(id)}
function addRoute(id){let o=db.routes.find(x=>x.id===id)||{},edit=!!id;openModal(edit?'Editar rota':'Nova rota',formBody([field('Nome da rota','name','text',o.name||''),field('Cliente','client','text',o.client||''),field('Origem','origin','text',o.origin||''),field('Destino','destination','text',o.destination||''),field('Horário de referência','time','time',o.time||'06:00')]),f=>{let v=values(f);if(edit)Object.assign(o,v);else db.routes.push({id:Date.now(),...v});persist('routes');render()})}
function editRoute(id){addRoute(id)}
function openSchedule(){openModal('Nova programação',formBody([field('Data','date','date',today),field('Motorista','driver','select',db.drivers[0]?.name||'',db.drivers.map(x=>x.name)),field('Veículo','vehicle','select',db.vehicles[0]?.code||'',db.vehicles.map(x=>x.code)),field('Rota','route','select',db.routes[0]?.name||'',db.routes.map(x=>x.name)),field('Início','start','time','05:30'),field('Término','end','time','14:00'),field('Situação','status','select','Programada',['Programada','Realizada','Atrasada','Substituição','Cancelada'])]),f=>{db.schedules.unshift({id:Date.now(),...values(f)});persist('schedules');render()})}
function addProcedure(){openModal('Novo procedimento',formBody([field('Título','title'),field('Categoria','category','select','Operação',['Operação','Ocorrências','Frota','Motoristas','Atendimento','Segurança']),field('Orientações','body','textarea')]),f=>{db.procedures.unshift({id:Date.now(),...values(f)});persist('procedures');render()})}
function removeItem(key,id){if(!confirm('Confirma a exclusão deste registro?'))return;db[key]=db[key].filter(x=>x.id!==id);persist(key);render()}
function setTarget(){let n=prompt('Informe a meta de SLA em porcentagem (0 a 100):',db.slaTarget);if(n!==null&&Number(n)>=0&&Number(n)<=100){db.slaTarget=Number(n);persist('slaTarget');render()}}
function diag(i,v){let a=JSON.parse(localStorage.getItem('f360_diag')||'{}');a[i]=v;localStorage.setItem('f360_diag',JSON.stringify(a));render()}
function exportCSV(){let heads=['Data','Hora','Tipo','Gravidade','Veículo','Motorista','Rota','Passageiros afetados','Minutos atraso','Status','Descrição','Providências'];let keys=['date','time','type','severity','vehicle','driver','route','affected','minutes','status','description','action'];let csv=[heads,...db.occurrences.map(o=>keys.map(k=>String(o[k]??'').replace(/"/g,'""'))) ].map(r=>r.map(x=>'"'+x+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='fretamento360-ocorrencias.csv';a.click();URL.revokeObjectURL(a.href)}
render();
</script>
</body></html>
